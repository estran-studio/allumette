name: Allumette CI and Deploy


on:
  push:
    branches:
      - main

env: 
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  packages: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Dependency
        run: sudo apt-get update && sudo apt-get install g++ make pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev && rustup component add rustfmt
      - name: Dependencies
        run: cargo vendor
      - name: Test
        run: make test
      - name: Style Check
        run: make format
      - name: Build allumette
        run: make build_docker_allumette_server IMAGE_TAG=${GITHUB_SHA}
      - name: Publish docker allumette
        run: make push_docker_allumette_server IMAGE_TAG=${GITHUB_SHA}

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            sudo env IMAGE_TAG="$IMAGE_TAG" sh -eu -c '
              cd /opt/allumette
              test -f compose.yaml
              test -f .env
              sed -i "s|^ALLUMETTE_IMAGE=.*|ALLUMETTE_IMAGE=ghcr.io/estran-studio/allumette-server:${IMAGE_TAG}|" .env
              docker compose config -q
              docker compose pull allumette
              docker compose up -d --no-deps allumette
              docker compose ps allumette
            '
            sleep 3
            curl --fail --silent --show-error https://allumette.estran.studio/health
        env:
          IMAGE_TAG: ${{ github.sha }}
